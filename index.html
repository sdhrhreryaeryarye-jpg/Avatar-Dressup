<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Примерочная аватаров</title>
<style>
:root{--face:#c0c0c0;--hi:#fff;--sh:#808080;--dk:#000}
*{box-sizing:border-box}
body{margin:0;background:#008080;font:13px Tahoma,"MS Sans Serif",Arial,sans-serif;color:#000;padding:8px}
.win{max-width:980px;margin:0 auto 10px;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);padding:3px}
.title{background:linear-gradient(90deg,#000080,#1084d0);color:#fff;font-weight:bold;padding:3px 6px;display:flex;justify-content:space-between}
.main{display:flex;flex-wrap:wrap;gap:10px;padding:8px}
.left{flex:0 0 auto;width:min(100%,380px)}
.right{flex:1 1 340px;min-width:0}
.sunk{border:2px solid;border-color:var(--sh) var(--hi) var(--hi) var(--sh);background:#fff}
button,select,input,textarea{font:inherit}
.btn{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);padding:4px 10px;cursor:pointer;color:#000}
.btn:active,.btn.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);padding:5px 9px 3px 11px}
.btn.sm{padding:2px 6px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.checker{background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%),linear-gradient(45deg,#ccc 25%,transparent 25%,transparent 75%,#ccc 75%);background-size:16px 16px;background-position:0 0,8px 8px}
#stage{position:relative;width:100%;aspect-ratio:1;overflow:hidden}
.tabs{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:-2px;position:relative;z-index:1}
.tab{background:var(--face);border:2px solid;border-bottom:none;border-color:var(--hi) var(--dk) transparent var(--hi);padding:4px 10px;cursor:pointer}
.tab.on{font-weight:bold;padding-bottom:6px;margin-top:-2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px;max-height:300px;overflow:auto;padding:6px;background:var(--face)}
.cell{background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);padding:3px;cursor:pointer;display:flex;flex-direction:column;gap:2px;align-items:center;font-size:11px;color:#000}
.cell.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);background:#000080;color:#fff}
.cell img,.cell .none{width:100%;aspect-ratio:1;display:block;image-rendering:pixelated}
.cell .none{display:flex;align-items:center;justify-content:center;font-size:22px;color:#800}
.cell span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea{width:100%;height:64px;resize:vertical;font-family:Consolas,monospace;font-size:12px}
.plate{margin-top:8px;padding:6px;background:#18181b;color:#efeff1;display:flex;gap:8px;align-items:baseline;min-height:34px}
.plate b{padding:2px 8px;border:2px solid;border-color:#fff #000 #000 #fff;flex:0 0 auto}
.plate span{overflow-wrap:anywhere}
.say{display:flex;gap:6px;margin-top:8px}
.say input{flex:1;min-width:0;padding:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
#ana{margin-top:6px;font-size:12px;min-height:30px;padding:4px 6px;background:#ffffe1;border:1px solid #000}
.status{border-top:2px solid var(--sh);padding:4px 8px;font-size:12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
label{display:inline-flex;gap:4px;align-items:center}
.pbody{padding:8px}
.plist{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.pc{width:112px;background:var(--face);border:2px solid;border-color:var(--hi) var(--dk) var(--dk) var(--hi);padding:4px;display:flex;flex-direction:column;gap:4px;align-items:center}
.pc.on{border-color:var(--dk) var(--hi) var(--hi) var(--dk);background:#000080;color:#fff}
.pc canvas{width:96px;height:96px;cursor:pointer;image-rendering:pixelated}
.pc .pn{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;font-size:12px}
.pc .pb{display:flex;gap:3px}
.empty{color:#444;margin-top:8px}
details{margin-top:10px}
</style>
</head>
<body>
<div class="win">
  <div class="title"><span>Примерочная аватаров</span><span>_ □ ✕</span></div>
  <div class="main">
    <div class="left">
      <div class="sunk checker" id="bg"><div id="stage"></div></div>
      <div class="plate"><b id="plateName">Зритель</b><span id="plateMsg">Привет, чат!</span></div>
      <div class="say">
        <input id="say" type="text" maxlength="300" placeholder="Напишите сообщение и нажмите Enter">
        <button class="btn" id="sayBtn">Сказать</button>
      </div>
      <div class="chips" id="chips"></div>
      <div id="ana">Здесь будет разбор сообщения: эмоция, капс, прыжок, длина реакции.</div>
      <div class="row">
        <label>Эмоция: <select id="force"></select></label>
        <label>Фон: <select id="bgSel">
          <option value="checker">шахматка</option><option value="dark">тёмный</option>
          <option value="light">светлый</option><option value="magenta">пурпурный</option>
        </select></label>
      </div>
      <div class="row">
        <label>Цвет ника: <input type="color" id="nick" value="#ff4500"></label>
        <label><input type="checkbox" id="smooth"> сглаживание</label>
      </div>
      <div class="row">
        <button class="btn" id="rand">Случайный</button>
        <button class="btn" id="reset">Сбросить</button>
        <button class="btn" id="png">Сохранить PNG</button>
      </div>
    </div>
    <div class="right">
      <div class="tabs" id="tabs"></div>
      <div class="sunk"><div class="grid" id="grid"></div></div>
      <div class="row" style="margin-top:10px"><b>JSON для награды:</b></div>
      <textarea id="json" spellcheck="false"></textarea>
      <div class="row">
        <button class="btn" id="copy">Копировать JSON</button>
        <button class="btn" id="apply">Применить JSON из поля</button>
        <span id="msg"></span>
      </div>
    </div>
  </div>
  <div class="status"><span id="info"></span><span>Вставьте скопированный JSON в награду за баллы</span></div>
</div>

<div class="win">
  <div class="title"><span>★ Избранные персонажи</span><span>_ □ ✕</span></div>
  <div class="pbody">
    <div class="row" style="margin-top:0">
      <input id="pname" type="text" maxlength="24" placeholder="Название (необязательно)" style="padding:4px;width:200px">
      <button class="btn" id="psave">★ Сохранить текущего</button>
      <button class="btn" id="pprev" title="Предыдущий">‹</button>
      <button class="btn" id="pnext" title="Следующий">›</button>
      <span id="pmsg"></span>
    </div>
    <div class="plist" id="plist"></div>
    <details>
      <summary>Перенос между устройствами</summary>
      <textarea id="pjson" spellcheck="false" placeholder="Сюда вставьте список избранного, который вы скопировали на другом устройстве"></textarea>
      <div class="row">
        <button class="btn" id="pexp">Скопировать список</button>
        <button class="btn" id="pimp">Добавить из поля</button>
      </div>
    </details>
  </div>
</div>

<script src="catalog.js"></script>
<script src="emotions.js"></script>
<script src="avatar.js"></script>
<script>
(function(){
  var C = window.CATALOG, E = window.EMOTIONS;
  if(!C||!E||!window.AvatarKit){document.body.innerHTML='<p style="color:#fff">Не найдены catalog.js, emotions.js или avatar.js. Запустите update_catalog.py</p>';return;}
  AvatarKit.init(C,E);
  var SLOTS=C.slots, items={}, total=0;
  SLOTS.forEach(function(s){(C.items[s.id]||[]).forEach(function(it){it.slot=s.id;items[it.id]=it;total++;});});

  var $=function(id){return document.getElementById(id);};
  var state, curTab=SLOTS[0].id, ta=$("json"), msgEl=$("msg");
  var av=null, activePreset="";

  function defaults(){
    var st={};
    SLOTS.forEach(function(s){var l=C.items[s.id]||[];st[s.id]=(s.required&&l.length)?l[0].id:"";});
    return st;
  }
  state=defaults();
  function toJson(p){var o={},src=p||state;SLOTS.forEach(function(s){o[s.id]=src[s.id]||"";});return JSON.stringify(o);}
  // проверяет объект и возвращает {state, bad:[id...]}; неизвестное выбрасывает
  function normalize(o){
    var n=defaults(),bad=[];
    if(!o||typeof o!=="object")return {state:n,bad:["?"]};
    SLOTS.forEach(function(s){
      var v=o[s.id]; if(v===undefined||v==="")return;
      if(items[v]&&items[v].slot===s.id)n[s.id]=v; else bad.push(String(v).slice(0,40));
    });
    return {state:n,bad:bad};
  }
  function contrast(hex){
    var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return (0.299*r+0.587*g+0.114*b)/255>0.6?"#000":"#fff";
  }
  function say(t){msgEl.textContent=t;clearTimeout(say.t);say.t=setTimeout(function(){msgEl.textContent="";},3500);}

  /* ---- аватар ---- */
  function makeAvatar(){
    if(av)av.destroy();
    av=AvatarKit.create($("stage"),{smooth:$("smooth").checked});
    av.setProfile(state);
  }
  function render(){
    av.setProfile(state);
    if(document.activeElement!==ta) ta.value=toJson();
    var nc=$("nick").value,pn=$("plateName");
    pn.style.background=nc;pn.style.color=contrast(nc);
    markPresets();
  }

  /* ---- вкладки и сетка ---- */
  function buildTabs(){
    var t=$("tabs");t.innerHTML="";
    SLOTS.forEach(function(s){
      var b=document.createElement("button");
      b.className="tab"+(s.id===curTab?" on":"");b.textContent=s.label;
      b.onclick=function(){curTab=s.id;buildTabs();buildGrid();};
      t.appendChild(b);
    });
  }
  function buildGrid(){
    var g=$("grid");g.innerHTML="";
    var slot=SLOTS.filter(function(s){return s.id===curTab;})[0];
    if(!slot.required)g.appendChild(cell(null,slot));
    var list=C.items[curTab]||[];
    list.forEach(function(it){g.appendChild(cell(it,slot));});
    if(!list.length){var p=document.createElement("div");p.textContent="Пока пусто";g.appendChild(p);}
  }
  function cell(it,slot){
    var b=document.createElement("button"),id=it?it.id:"";
    b.className="cell"+(state[slot.id]===id?" on":"");b.dataset.id=id;
    if(it){var im=document.createElement("img");im.src=it.file+"?v="+C.version;im.className="checker";im.loading="lazy";im.alt="";b.appendChild(im);}
    else{var n=document.createElement("div");n.className="none";n.textContent="∅";b.appendChild(n);}
    var sp=document.createElement("span");sp.textContent=it?(it.label||it.id):"нет";b.appendChild(sp);
    b.onclick=function(){state[slot.id]=id;markSel();render();};
    return b;
  }
  function markSel(){
    var cells=$("grid").children;
    for(var i=0;i<cells.length;i++)cells[i].classList.toggle("on",cells[i].dataset.id===(state[curTab]||""));
  }
  function refresh(){buildGrid();render();}

  /* ---- рисование персонажа на canvas (миниатюры и PNG) ---- */
  var imgCache={}, thumbTimer=0;
  function loadImg(url){
    if(!imgCache[url]){var i=new Image();i.onload=function(){clearTimeout(thumbTimer);thumbTimer=setTimeout(redrawThumbs,50);};i.src=url+"?v="+C.version;imgCache[url]=i;}
    return imgCache[url];
  }
  function faceUrl(key,baseKey){
    var a=C.face&&C.face.assets&&C.face.assets[key]; if(!a)return null;
    return (a.per&&a.per[baseKey])||a.file||null;
  }
  function drawProfile(cv,p){
    var size=cv.width,ctx=cv.getContext("2d"),smooth=$("smooth").checked;
    ctx.clearRect(0,0,size,size);ctx.imageSmoothingEnabled=smooth;
    var baseKey=String(p.base||"").replace(/^base_/,""),hid={};
    SLOTS.forEach(function(s){((C.hides||{})[p[s.id]]||[]).forEach(function(h){hid[h]=1;});});
    function put(img,it){
      if(!img||!img.complete||!img.naturalWidth)return;
      var s=(it&&it.scale)||1,w=size*s;
      ctx.drawImage(img,(size-w)/2+((it&&it.dx)||0)*size,(size-w)/2+((it&&it.dy)||0)*size,w,w);
    }
    C.order.forEach(function(name){
      if(hid[name])return;
      var it=items[p[name]];
      if(it&&it.slot===name)put(loadImg(it.file),it);
      else if(name==="brow"||name==="mouth"){
        var u=faceUrl(name+"_"+(name==="brow"?"neutral":"closed"),baseKey);
        if(u)put(loadImg(u),null);
      }
    });
  }

  /* ---- избранные пресеты ---- */
  var KEY="avatar-dressup-presets-v1", presets=[], memOnly=false;
  function loadPresets(){
    try{var s=localStorage.getItem(KEY);presets=s?JSON.parse(s):[];if(!Array.isArray(presets))presets=[];}
    catch(e){presets=[];memOnly=true;}
  }
  function savePresets(){
    try{localStorage.setItem(KEY,JSON.stringify(presets));}
    catch(e){memOnly=true;pmsg("Браузер не даёт сохранять: избранное пропадёт при закрытии страницы");}
  }
  function pmsg(t){var e=$("pmsg");e.textContent=t;clearTimeout(pmsg.t);pmsg.t=setTimeout(function(){e.textContent="";},4000);}
  function uid(){return "p"+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);}
  function findActive(){
    var cur=toJson();
    for(var i=0;i<presets.length;i++)if(toJson(normalize(presets[i].profile).state)===cur)return presets[i].id;
    return "";
  }
  function markPresets(){
    activePreset=findActive();
    var cards=$("plist").children;
    for(var i=0;i<cards.length;i++)cards[i].classList.toggle("on",cards[i].dataset.id===activePreset);
  }
  function redrawThumbs(){
    var cvs=$("plist").querySelectorAll("canvas");
    for(var i=0;i<cvs.length;i++){
      var p=presets.filter(function(x){return x.id===cvs[i].parentNode.dataset.id;})[0];
      if(p)drawProfile(cvs[i],normalize(p.profile).state);
    }
  }
  function applyPreset(p){
    var r=normalize(p.profile);
    state=r.state;refresh();
    if(r.bad.length)say("Часть предметов больше не существует и пропущена");
  }
  function buildPresets(){
    var box=$("plist");box.innerHTML="";
    if(!presets.length){var e=document.createElement("div");e.className="empty";e.textContent="Пока пусто. Соберите персонажа и нажмите «Сохранить текущего».";box.appendChild(e);return;}
    presets.forEach(function(p){
      var c=document.createElement("div");c.className="pc";c.dataset.id=p.id;
      var cv=document.createElement("canvas");cv.width=cv.height=192;cv.title="Надеть";
      cv.className="checker";
      cv.onclick=function(){applyPreset(p);};
      var n=document.createElement("div");n.className="pn";n.textContent=p.name;n.title=p.name;n.onclick=function(){applyPreset(p);};
      var b=document.createElement("div");b.className="pb";
      var ow=btn("↻","Заменить текущим образом",function(){p.profile=JSON.parse(toJson());savePresets();buildPresets();pmsg("Обновлено: "+p.name);});
      var rn=btn("✎","Переименовать",function(){var v=prompt("Название",p.name);if(v&&v.trim()){p.name=v.trim().slice(0,24);savePresets();buildPresets();}});
      var dl=btn("✕","Удалить",function(){if(confirm("Удалить «"+p.name+"»?")){presets=presets.filter(function(x){return x!==p;});savePresets();buildPresets();}});
      b.appendChild(ow);b.appendChild(rn);b.appendChild(dl);
      c.appendChild(cv);c.appendChild(n);c.appendChild(b);box.appendChild(c);
    });
    redrawThumbs();markPresets();
  }
  function btn(t,title,fn){var b=document.createElement("button");b.className="btn sm";b.textContent=t;b.title=title;b.onclick=fn;return b;}
  $("psave").onclick=function(){
    var name=$("pname").value.trim().slice(0,24)||("Персонаж "+(presets.length+1));
    presets.push({id:uid(),name:name,profile:JSON.parse(toJson())});
    $("pname").value="";savePresets();buildPresets();pmsg("Сохранено: "+name);
  };
  function step(d){
    if(!presets.length){pmsg("Избранное пусто");return;}
    var i=-1;for(var k=0;k<presets.length;k++)if(presets[k].id===activePreset)i=k;
    i=i<0?(d>0?0:presets.length-1):(i+d+presets.length)%presets.length;
    applyPreset(presets[i]);
  }
  $("pprev").onclick=function(){step(-1);};
  $("pnext").onclick=function(){step(1);};
  $("pexp").onclick=function(){
    var t=JSON.stringify(presets);$("pjson").value=t;
    var fin=function(ok){pmsg(ok?"Список скопирован":"Выделите текст в поле и скопируйте вручную");};
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(function(){fin(true);},function(){$("pjson").select();fin(false);});
    else{$("pjson").select();fin(false);}
  };
  $("pimp").onclick=function(){
    var arr;
    try{arr=JSON.parse($("pjson").value);}catch(e){pmsg("Не получилось прочитать список");return;}
    if(!Array.isArray(arr)){pmsg("Это не список избранного");return;}
    var added=0;
    arr.forEach(function(p){
      if(!p||typeof p!=="object"||typeof p.name!=="string"||!p.profile)return;
      presets.push({id:uid(),name:p.name.slice(0,24),profile:normalize(p.profile).state});added++;
    });
    savePresets();buildPresets();pmsg("Добавлено: "+added);
  };

  /* ---- JSON, кнопки, фон ---- */
  function copyText(t){
    ta.value=t;
    if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).then(function(){return true;},function(){return fb();});
    return Promise.resolve(fb());
  }
  function fb(){ta.focus();ta.select();try{return document.execCommand("copy");}catch(e){return false;}}
  $("copy").onclick=function(){copyText(toJson()).then(function(ok){say(ok?"Скопировано":"Выделите текст и скопируйте вручную");});};
  $("apply").onclick=function(){
    var o;try{o=JSON.parse(ta.value);}catch(e){say("Не получилось прочитать JSON");return;}
    var r=normalize(o);
    if(r.bad.length){say("Нет такого предмета: "+r.bad[0]);return;}
    state=r.state;refresh();say("Применено");
  };
  $("reset").onclick=function(){state=defaults();refresh();};
  $("rand").onclick=function(){
    SLOTS.forEach(function(s){
      var l=C.items[s.id]||[];
      if(!l.length){state[s.id]="";return;}
      if(!s.required&&Math.random()<0.4){state[s.id]="";return;}
      state[s.id]=l[Math.floor(Math.random()*l.length)].id;
    });
    refresh();
  };
  $("png").onclick=function(){
    var cv=document.createElement("canvas");cv.width=cv.height=512;
    drawProfile(cv,state);
    try{var a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="avatar.png";a.click();}
    catch(e){say("Сохранение работает только когда страница открыта по ссылке (не с диска)");}
  };
  $("bgSel").onchange=function(){
    var b=$("bg"),v=this.value;
    b.className="sunk"+(v==="checker"?" checker":"");
    b.style.background=v==="dark"?"#18181b":v==="light"?"#f0f0f0":v==="magenta"?"#ff00ff":"";
  };
  $("nick").oninput=render;
  $("smooth").onchange=function(){makeAvatar();redrawThumbs();};

  /* ---- «Сказать» ---- */
  var labels=E.labels, fsel=$("force");
  [["","авто (по словам)"]].concat(Object.keys(labels).map(function(k){return [k,labels[k]];})).forEach(function(p){
    var o=document.createElement("option");o.value=p[0];o.textContent=p[1];fsel.appendChild(o);
  });
  var SAMPLES=["Привет, чат!","ПРИВЕТ ВСЕМ","БЕСИТ!","ну ок...","ого!? серьёзно?","грустно((","ой, неловко","хахах круто!","Люблю вас <3"];
  SAMPLES.forEach(function(t){
    var b=document.createElement("button");b.className="btn sm";b.textContent=t;
    b.onclick=function(){$("say").value=t;speak();};
    $("chips").appendChild(b);
  });
  function speak(){
    var t=$("say").value.trim();if(!t)return;
    $("plateMsg").textContent=t;
    var a=av.react(t,{emotion:fsel.value||undefined});
    var an=$("ana");
    if(a.skip){an.textContent="Реакции нет: в сообщении только эмоуты, ссылки или упоминания.";return;}
    var parts=["Эмоция: "+(labels[a.emotion]||a.emotion)+(a.score?" (совпадений: "+a.score+")":""),
      a.caps?"КАПС: тряска":"не капс",a.bang?"есть «!»: прыжок":"без «!»: без прыжка",
      "символов: "+a.len,"реакция: "+a.duration.toFixed(1).replace(".",",")+" с"];
    an.textContent=parts.join(" · ");
  }
  $("sayBtn").onclick=speak;
  $("say").onkeydown=function(e){if(e.key==="Enter")speak();};

  $("info").textContent="Каталог v"+C.version+" · предметов: "+total;
  loadPresets();
  makeAvatar();buildTabs();buildGrid();buildPresets();render();
  if(memOnly)pmsg("Браузер не даёт сохранять: избранное пропадёт при закрытии страницы");
  setTimeout(function(){$("say").value="Привет, чат!";speak();},500);
})();
</script>
</body>
</html>
